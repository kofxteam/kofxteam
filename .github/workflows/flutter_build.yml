name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "release atau debug"
        required: false
        default: "release"
        type: string
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type || 'release' }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Create GitHub Release (on manual dispatch + release)
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type || 'release') != 'debug'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
